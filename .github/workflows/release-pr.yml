name: Release PR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for pending changesets
        id: changesets
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release token
        if: steps.changesets.outputs.found == 'true'
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          if [ -z "$RELEASE_PR_TOKEN" ]; then
            echo "::error::Missing RELEASE_PR_TOKEN. Add a repository secret with Contents and Pull requests write access."
            exit 1
          fi

      - name: Prepare release branch
        if: steps.changesets.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C chore/release origin/main
          pnpm changeset version
          pnpm install --lockfile-only

          if git diff --quiet; then
            echo "No release changes were generated."
            exit 0
          fi

          git add --all
          git commit -m "chore: version packages"
          git push --force-with-lease origin chore/release

          existing_pr="$(gh pr list --base main --head chore/release --state open --json number --jq '.[0].number')"
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head chore/release \
              --title "chore: version packages" \
              --body "Automated release PR generated from pending Changesets. Merging this PR creates the corresponding GitHub Release; npm publishing is not enabled." \
              >/dev/null
          else
            gh pr edit "$existing_pr" \
              --title "chore: version packages" \
              --body "Automated release PR generated from pending Changesets. Merging this PR creates the corresponding GitHub Release; npm publishing is not enabled."
          fi
