schemaVersion: 1
workflow:
  initialStage: spec
  runDirectory: .bossflow/runs
  verification:
    requiredCommands:
      - lint
      - typecheck
      - test
      - build
    defaultTimeoutMs: 120000
    commandOverrides: {}
models:
  defaultProfile: deepseek
  profiles:
    openai:
      kind: openai
      apiKeyEnv: OPENAI_API_KEY
    deepseek:
      kind: openai-compatible
      model: deepseek-flash
      baseUrl: https://api.deepseek.com
      apiKeyEnv: DEEPSEEK_API_KEY
